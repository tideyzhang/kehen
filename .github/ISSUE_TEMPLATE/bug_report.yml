name: 错误反馈
description: 用虚构数据描述遇到的问题
body:
  - type: markdown
    attributes:
      value: 请勿上传真实学生名单、积分、数据库、凭据或含个人信息的截图。
  - type: input
    id: version
    attributes:
      label: 软件版本和系统
      placeholder: 例如 0.7.4-beta.1 / Windows 11 / 125%缩放
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤、实际结果及预期结果
    validations:
      required: true
